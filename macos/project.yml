name: Readless
options:
  bundleIdPrefix: com.readless
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  # Local SPM package for library modules (Core, Networking, Storage, etc.)
  ReadlessModules:
    path: .
  # External packages are resolved via the local Package.swift

targets:
  Readless:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Resources/**"
          - "Services/README_SuggestionEngine.md"
      - path: Sources/App/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readless.app
        PRODUCT_NAME: Readless
        INFOPLIST_FILE: Sources/App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5CS6HUB4P2
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: ReadlessModules
        product: Core
      - package: ReadlessModules
        product: LiquidGlassKit
      - package: ReadlessModules
        product: Networking
      - package: ReadlessModules
        product: Storage
      - package: ReadlessModules
        product: AIServices
      - package: ReadlessModules
        product: ReaderFeature
      - package: ReadlessModules
        product: LibraryFeature
      - package: ReadlessModules
        product: Utils
      - package: ReadlessModules
        product: UI
      - package: ReadlessModules
        product: KeyboardShortcuts
