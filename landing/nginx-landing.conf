# Nginx configuration snippet for Readless Landing Page
# Insert these location blocks BEFORE the existing `location /` block
# in /etc/nginx/sites-available/readless.cc
#
# The ^~ modifier ensures these rules take priority over the existing
# regex rules like `location ~* \.(css|js|...)$`

# ===== Landing Page Static Files =====

# Root path: serve landing page HTML
location = / {
    root /var/www/readless-landing;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}

# All landing page static assets (CSS, JS, images)
# ^~ prefix match overrides regex matches
location ^~ /landing-assets/ {
    alias /var/www/readless-landing/landing-assets/;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}

# Favicon
location = /favicon.ico {
    root /var/www/readless-landing;
    expires 30d;
    access_log off;
    log_not_found off;
}

# Robots.txt
location = /robots.txt {
    root /var/www/readless-landing;
    expires 1d;
    access_log off;
}

# Apple touch icon (optional, for iOS bookmarks)
# Uncomment when apple-touch-icon.png is available in landing-assets/
# location = /landing-assets/apple-touch-icon.png {
#     alias /var/www/readless-landing/landing-assets/apple-touch-icon.png;
#     expires 30d;
#     access_log off;
#     log_not_found off;
# }

# ===== API routes remain unchanged =====
# The existing location blocks for /api/, /health, /docs, /redoc
# continue to proxy to FastAPI at 127.0.0.1:8001
# No changes needed for those.
